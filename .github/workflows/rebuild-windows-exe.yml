name: Rebuild Windows executable

on:
  push:
    branches: [main]
    paths-ignore:
      - "ANINO_SA_GUBAT.exe"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run ward VFX regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_vfx_zones.py

      - name: Run gameplay regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_gameplay_fixes.py

      - name: Run headless smoke tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/smoke_test.py

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ANINO_SA_GUBAT --collect-all pygame --collect-all numpy --collect-all moderngl --collect-all glcontext --add-data "assets;assets" main.py
          if (!(Test-Path "dist/ANINO_SA_GUBAT.exe")) { throw "PyInstaller did not produce the executable." }

      - name: Commit refreshed executable
        shell: pwsh
        run: |
          git fetch origin main
          git rebase origin/main
          Copy-Item "dist/ANINO_SA_GUBAT.exe" "ANINO_SA_GUBAT.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANINO_SA_GUBAT.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: refresh Windows executable from latest main [skip ci]"
            git push
          }
